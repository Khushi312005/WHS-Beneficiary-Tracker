<header>

    <button onclick="logout()">
        Logout
    </button>
</header>


<!-- MAIN NAVIGATION -->

<nav>

    <b>Beneficiary Management</b>

    <span onclick="window.location.href='home.html'">

<main>

<main>

<h2>Register Beneficiary</h2>

<form id="beneficiaryForm">

    <label>Beneficiary ID</label>
    <input id="beneficiaryId" required>

    <label>Name</label>
    <input id="name" required>

    <label>Village</label>
    <input id="village" required>

    <label>WHS</label>
    <select id="whs" required></select>

    <label>Activity</label>
    <select id="activity">
        <option>Agriculture</option>
        <option>Irrigation</option>
        <option>Fisheries</option>
        <option>Livestock</option>
        <option>Other</option>
    </select>

    <label>Contact</label>
    <input id="contact">

    <button type="submit">Save Beneficiary</button>

</form>

<h2>Beneficiary List</h2>

<table>
<thead>
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Village</th>
    <th>WHS</th>
    <th>Activity</th>
    <th>Contact</th>
    <th>Action</th>
</tr>
</thead>

<tbody id="beneficiaryTable"></tbody>
</table>

<button onclick="backToWHS()">← Previous</button>
<button onclick="nextModule()">Next → Activities</button>

</main>

<script src="beneficiaries.js"></script>

</body>
