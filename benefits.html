<!DOCTYPE html>
<html>

<head>
    <title>Benefit Tracking</title>
    <link rel="stylesheet" href="benefits.css">
</head>

<body>

<header>

    <h1>Benefit Tracking Module</h1>

    <button onclick="logout()">
        Logout
    </button>

</header>


<!-- MAIN NAVIGATION -->

<nav>

    <b>Benefit Tracking</b>

    <span onclick="window.location.href='home.html'">
        🏠 Home
    </span>

    <span onclick="window.location.href='whs.html'">
        💧 WHS
    </span>

    <span onclick="window.location.href='beneficiaries.html'">
        👥 Beneficiaries
    </span>

    <span onclick="window.location.href='activities.html'">
        🌾 Activities
    </span>

    <span onclick="window.location.href='benefits.html'">
        📈 Benefits
    </span>

    <span onclick="window.location.href='maintenance.html'">
        🔧 Maintenance
    </span>

    <span onclick="window.location.href='dashboard.html'">
        📊 Dashboard
    </span>

    <span onclick="window.location.href='reports.html'">
        📄 Reports
    </span>

</nav>


<main>


<h2>Record Beneficiary Benefit</h2>


<form id="benefitForm">

    <label>WHS</label>

    <select id="whs" required></select>


    <label>Beneficiary</label>

    <select id="beneficiary" required></select>


    <label>Benefit Type</label>

    <select id="benefitType">

        <option>Increased Irrigation</option>

        <option>Improved Agriculture</option>

        <option>Fisheries Benefit</option>

        <option>Livestock Benefit</option>

        <option>Water Availability</option>

        <option>Other</option>

    </select>


    <label>Date</label>

    <input
        type="date"
        id="date"
        required
    >


    <label>Description</label>

    <textarea id="description"></textarea>


    <button type="submit">
        Save Benefit
    </button>

</form>


<h2>Benefit Records</h2>


<table>

<thead>

<tr>
    <th>WHS</th>
    <th>Beneficiary</th>
    <th>Benefit</th>
    <th>Date</th>
    <th>Description</th>
</tr>

</thead>


<tbody id="benefitTable"></tbody>

</table>


<br>


<button onclick="previous()">
    ← Previous
</button>


<button onclick="next()">
    Next → Maintenance
</button>


</main>


<script src="benefits.js"></script>

</body>

</html>
