<!DOCTYPE html>
<html>

<head>

    <title>Activities & Livelihood</title>

    <link rel="stylesheet" href="activities.css">

</head>


<body>


<header>

    <h1>Activity & Livelihood Tracking</h1>

    <button onclick="logout()">
        Logout
    </button>

</header>


<!-- MAIN NAVIGATION -->

<nav>

    <b>Activity & Livelihood</b>

    <span onclick="window.location.href='home.html'">
        🏠 Home
    </span>

    <span onclick="window.location.href='whs.html'">
        💧 WHS
    </span>

    <span onclick="window.location.href='beneficiaries.html'">
        👥 Beneficiaries
    </span>

    <span onclick="window.location.href='activities.html'">
        🌾 Activities
    </span>

    <span onclick="window.location.href='benefits.html'">
        📈 Benefits
    </span>

    <span onclick="window.location.href='maintenance.html'">
        🔧 Maintenance
    </span>

    <span onclick="window.location.href='dashboard.html'">
        📊 Dashboard
    </span>

    <span onclick="window.location.href='reports.html'">
        📄 Reports
    </span>

</nav>


<main>


<h2>Record Activity</h2>


<form id="activityForm">


    <label>WHS</label>

    <select id="whs" required></select>


    <label>Village</label>

    <input
        id="village"
        required
    >


    <label>Activity Type</label>

    <select id="activityType">

        <option>Agriculture</option>

        <option>Irrigation</option>

        <option>Fisheries</option>

        <option>Livestock</option>

        <option>Other</option>

    </select>


    <label>Number of Beneficiaries</label>

    <input
        type="number"
        id="beneficiaryCount"
        required
    >


    <label>Description</label>

    <textarea id="description"></textarea>


    <button type="submit">
        Save Activity
    </button>


</form>


<h2>Activity Records</h2>


<table>

<thead>

<tr>

    <th>WHS</th>

    <th>Village</th>

    <th>Activity</th>

    <th>Beneficiaries</th>

    <th>Description</th>

</tr>

</thead>


<tbody id="activityTable"></tbody>


</table>


<br>


<button onclick="previous()">
    ← Previous
</button>


<button onclick="next()">
    Next → Benefits
</button>


</main>


<script src="activities.js"></script>


</body>

</html>
